server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Las peticiones a la API se reenvían al contenedor "api"
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
